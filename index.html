<style>
  :root{
    --bg:#FAFAF9; --surface:#FFFFFF; --border:#E7E5E4; --muted:#78716C; --fg:#1C1917;
    --primary-50:#E6FAF0; --primary-400:#33CC81; --primary-500:#00BF63; --primary-600:#00A355;
    --warning:#E0A030; --danger:#E0523D; --page-bg:#EDEBE6;
  }
  [data-theme="dark"]{
    --bg:#0B0F0E; --surface:#161B1A; --border:#262E2C; --muted:#8A938F; --fg:#F2F4F3;
    --primary-50:#0A3B23; --page-bg:#000000;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; overscroll-behavior:none; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--fg);
  }
  #page{ display:flex; justify-content:center; height:100vh; height:100dvh; }
  #app{
    width:100%; max-width:480px; height:100%; background:var(--bg); position:relative;
    display:flex; flex-direction:column; overflow:hidden;
  }
  @media (min-width:720px){
    #app{ box-shadow:0 0 60px rgba(0,0,0,.15); }
  }
  input, button{ font-family:inherit; }
  button{ cursor:pointer; }
  svg{ vertical-align:-4px; flex-shrink:0; }

  .screen{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  /* ---------- shared ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px;
  }
  .btn{
    border:none; border-radius:18px; padding:16px; font-size:16px; font-weight:700; width:100%;
    text-align:center; display:block;
  }
  .btn-primary{ background:var(--primary-500); color:#fff; }
  .btn-primary:disabled{ opacity:.4; }
  .btn-secondary{ background:var(--surface); color:var(--fg); border:1px solid var(--border); }
  .btn-ghost{ background:transparent; color:var(--primary-600); }
  .section-title{ font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .input{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface);
    font-size:16px; font-weight:700; color:var(--fg); outline:none;
  }
  .input:focus{ border-color:var(--primary-500); }
  .label{ font-size:11px; font-weight:700; color:var(--muted); display:block; margin-bottom:6px; }
  .row{ display:flex; gap:10px; }
  .grow{ flex:1; }

  /* ---------- tabbar ---------- */
  .tabbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:1000;
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:10px 0 calc(18px + env(safe-area-inset-bottom));
  justify-content:space-around;
}
  .tab{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; font-weight:700; color:var(--muted); flex:1; }
  .tab.active{ color:var(--primary-600); }
  .tab .ic{ display:flex; align-items:center; justify-content:center; }

  /* ---------- dashboard ---------- */
  .dash-header{ padding:18px 20px 4px; }
  .dash-header h1{ font-size:23px; font-weight:800; margin:0; }
  .dash-header p{ font-size:13px; color:var(--muted); margin:2px 0 0; }

  .progress-card{ margin:14px 20px 0; padding:22px; }
  .progress-top{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:14px; }
  .progress-top .big{ font-size:36px; font-weight:800; }
  .progress-top .unit{ font-size:15px; color:var(--muted); font-weight:700; margin-left:2px; }
  .progress-top .goal{ font-size:13px; color:var(--muted); text-align:right; }
  .bar-track{ height:13px; background:var(--border); border-radius:8px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:8px; transition:width .35s ease, background-color .35s ease; }
  .progress-bottom{ display:flex; justify-content:space-between; margin-top:9px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .progress-bottom .remaining{ color:var(--primary-600); font-weight:700; }

  .stats-row{ display:flex; gap:10px; margin:12px 20px 0; }
  .stat-mini{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; }
  .stat-mini .v{ font-size:16px; font-weight:800; }
  .stat-mini .l{ font-size:10.5px; color:var(--muted); font-weight:700; }

  .meals-header{ display:flex; justify-content:space-between; align-items:center; margin:22px 20px 10px; }
  .meals-header h2{ font-size:15px; font-weight:800; margin:0; }
  .sort-btn{
  background:none;
  border:none;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}
  .meal-list{ display:flex; flex-direction:column; gap:9px; padding:0 20px 20px; }
  .meal-item{
    display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-radius:16px;
    background:var(--surface); border:1px solid var(--border);
  }
  .meal-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .meal-icon{ width:36px; height:36px; border-radius:11px; background:var(--primary-50); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .meal-name{ font-size:14.5px; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meal-meta{ font-size:11.5px; color:var(--muted); margin:2px 0 0; }
  .meal-actions{ display:flex; align-items:center; gap:9px; margin-left:8px; flex-shrink:0; }
  .icon-btn{ background:none; border:none; color:var(--muted); padding:2px; display:flex; }
  .icon-btn-fav-active{ color:var(--warning); }
  .meal-protein{ font-size:14.5px; font-weight:800; color:var(--primary-600); }

  .fab{
    position:absolute; bottom:88px; right:18px; width:56px; height:56px; border-radius:28px;
    background:var(--primary-500); color:#fff; font-size:28px; border:none; display:flex; align-items:center;
    justify-content:center; box-shadow:0 8px 18px rgba(34,168,99,.4);
  }
  .empty-state{ text-align:center; color:var(--muted); font-size:13.5px; padding:50px 30px; }

  /* ---------- onboarding ---------- */
  .ob-progress{ display:flex; gap:6px; padding:18px 24px 0; }
  .ob-progress div{ flex:1; height:4px; border-radius:4px; background:var(--border); }
  .ob-progress div.done{ background:var(--primary-500); }
  .ob-body{ padding:26px 24px 0; flex:1; }
  .ob-body h1{ font-size:23px; font-weight:800; margin:0 0 6px; }
  .ob-body .sub{ font-size:13.5px; color:var(--muted); margin:0 0 24px; line-height:1.45; }
  .ob-option{
    display:flex; align-items:center; justify-content:space-between; padding:15px; border-radius:16px;
    border:1.5px solid var(--border); background:var(--surface); margin-bottom:9px;
  }
  .ob-option.selected{ border-color:var(--primary-500); background:var(--primary-50); }
  .ob-option .lab{ font-size:14.5px; font-weight:700; }
  .ob-option .desc{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .radio{ width:19px; height:19px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; }
  .ob-option.selected .radio{ border-color:var(--primary-500); background:var(--primary-500); box-shadow:inset 0 0 0 3px var(--surface); }
  .ob-footer{ padding:18px 24px max(24px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  .goal-preview{ text-align:center; padding:26px 10px; background:var(--primary-50); border-radius:22px; margin-top:22px; }
  .goal-preview .num{ font-size:44px; font-weight:800; color:var(--primary-600); line-height:1; }
  .goal-preview .lbl{ font-size:12.5px; color:var(--muted); margin-top:8px; font-weight:600; }

  /* ---------- history ---------- */
  .day-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden; }
  .day-head{ padding:14px; display:flex; align-items:center; justify-content:space-between; }
  .day-head .name{ font-size:14.5px; font-weight:700; text-transform:capitalize; }
  .day-bar{ height:6px; background:var(--border); border-radius:4px; margin-top:8px; width:150px; overflow:hidden; }
  .day-bar .fill{ height:100%; border-radius:4px; transition:background-color .35s ease; }
  .day-right{ text-align:right; }
  .day-right .g{ font-size:15px; font-weight:800; }
  .day-right .pct{ font-size:11px; color:var(--muted); font-weight:600; }
  .day-detail{ padding:0 14px 14px; display:flex; flex-direction:column; gap:8px; }

  /* ---------- add meal ---------- */
  .am-header{ display:flex; align-items:center; gap:11px; padding:16px 20px 10px; }
  .am-close{ width:32px; height:32px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .am-header h1{ font-size:17px; font-weight:800; margin:0; }
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding:0 20px 4px; margin-bottom:14px; }
  .chip{
    white-space:nowrap; padding:9px 13px; border-radius:20px; background:var(--surface); border:1px solid var(--border);
    font-size:12.5px; font-weight:700; color:var(--fg);
  }
  .chip-active{ background:var(--primary-500); border-color:var(--primary-500); color:#fff; }
  .food-row{
    display:flex; justify-content:space-between; align-items:center; padding:13px; border-radius:16px;
    background:var(--surface); border:1px solid var(--border);
  }
  .food-row.selected{ border-color:var(--primary-500); background:var(--primary-50); }
  .food-name{ font-size:14.5px; font-weight:700; margin:0; }
  .food-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .qty-stepper{ display:flex; align-items:center; justify-content:center; gap:16px; margin:14px 0; }
  .qty-btn{ width:38px; height:38px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); font-size:19px; font-weight:700; color:var(--fg); }
  .qty-val{ font-size:24px; font-weight:800; min-width:64px; text-align:center; }
  .qty-val-input{
    font-size:24px; font-weight:800; width:90px; text-align:center; border:none; background:transparent;
    color:var(--fg); outline:none; -moz-appearance:textfield;
  }
  .qty-val-input::-webkit-outer-spin-button, .qty-val-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .footer-note{ text-align:center; font-size:11px; color:var(--muted); padding:14px 30px 22px; }

  .dialog-backdrop{
    position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center;
    justify-content:center; padding:24px; z-index:50;
  }
  .dialog-card{ background:var(--surface); border-radius:20px; padding:22px; width:100%; max-width:320px; }
  .dialog-title{ font-size:16px; font-weight:800; margin-bottom:8px; }
  .dialog-message{ font-size:13.5px; color:var(--muted); line-height:1.45; }
</style>
</head>
<body>
<div id="page"><div id="app"></div></div>

<script>
/* =========================================================
   PROTEIN TRACKER — app de una sola página, sin backend
   Todo el estado vive en localStorage del navegador.
   ========================================================= */

/* ---------------- Storage ---------------- */
const LS_KEYS = { profile: "pt_profile", meals: "pt_meals", customFoods: "pt_custom_foods", theme: "pt_theme", weightLog: "pt_weight_log" };

function lsGet(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch { return fallback; }
}
function lsSet(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

function getProfile() { return lsGet(LS_KEYS.profile, null); }
function saveProfile(p) { lsSet(LS_KEYS.profile, p); }
function getMeals() { return lsGet(LS_KEYS.meals, []); }
function saveMeals(list) { lsSet(LS_KEYS.meals, list); }
function getCustomFoods() { return lsGet(LS_KEYS.customFoods, []); }
function saveCustomFoods(list) { lsSet(LS_KEYS.customFoods, list); }

function getWeightLog() { return lsGet(LS_KEYS.weightLog, []); }
function saveWeightLogList(list) { lsSet(LS_KEYS.weightLog, list); }
/** Registra (o actualiza si ya existe) el peso del día indicado. */
function logWeight(weightKg, dateKey) {
  const log = getWeightLog();
  const idx = log.findIndex(function (e) { return e.date === dateKey; });
  if (idx !== -1) log[idx] = { date: dateKey, weightKg: weightKg };
  else log.push({ date: dateKey, weightKg: weightKg });
  saveWeightLogList(log);
}

function uid(prefix) { return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7); }

/** Combina la fecha de hoy con una hora "HH:MM" elegida por el usuario. */
function buildLoggedAt(timeStr) {
  const now = new Date();
  if (!timeStr) return now.toISOString();
  const parts = timeStr.split(":");
  const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return now.toISOString();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
  return d.toISOString();
}

/* ---------------- Catálogo de alimentos ---------------- */
const FOOD_CATALOG = [
  { id: "f-pollo", name: "Pechuga de pollo (cocida)", protein100: 31.0, kcal100: 165, unit: "g", portionG: 150, portionLabel: "pechuga" },
  { id: "f-res", name: "Carne de res (magra, cocida)", protein100: 26.0, kcal100: 217, unit: "g", portionG: 150, portionLabel: "porción" },
  { id: "f-huevo", name: "Huevo entero", protein100: 13.0, kcal100: 143, unit: "unit", unitWeight: 50 },

/* ---------------- Cálculo de proteína (evidencia científica) ---------------- */
const BASE_RANGES = {
  maintain: [1.0, 1.6],
  lose_fat: [1.6, 2.4],
  gain_muscle: [1.6, 2.2],
};
const ACTIVITY_FACTOR = { sedentary: 0.0, light: 0.35, moderate: 0.65, high: 1.0 };

function proteinPerKg(activity, goal) {
  const range = BASE_RANGES[goal];
  const factor = ACTIVITY_FACTOR[activity];
  return Math.round((range[0] + (range[1] - range[0]) * factor) * 100) / 100;
}
function dailyProteinGoal(opts) {
  const perKg = proteinPerKg(opts.activityLevel, opts.goal);
  return { proteinGoalG: Math.round(opts.weightKg * perKg), proteinPerKg: perKg };
}
function calcBMI(weightKg, heightCm) {
  const m = heightCm / 100;
  return Math.round((weightKg / (m * m)) * 10) / 10;
}
function bmiCategory(bmi) {
  if (bmi < 18.5) return "Bajo peso";
  if (bmi < 25) return "Peso saludable";
  if (bmi < 30) return "Sobrepeso";
  return "Obesidad";
}
function suggestGoal(bmi) {
  if (bmi >= 25) return "lose_fat";
  if (bmi < 18.5) return "gain_muscle";
  return "maintain";
}
function goalLabel(g) {
  return { maintain: "Mantener peso", lose_fat: "Perder grasa", gain_muscle: "Ganar masa muscular" }[g];
}
function macrosFor(food, qty, unit) {
  if (!food || !qty || qty <= 0) return { protein: 0, kcal: food && food.kcal100 != null ? 0 : null };
  const grams = unit === "unit" ? qty * (food.unitWeight || 50) : qty;
  const factor = grams / 100;
  return {
    protein: Math.round(food.protein100 * factor * 10) / 10,
    kcal: food.kcal100 != null ? Math.round(food.kcal100 * factor * 10) / 10 : null,
  };
}
const MEAL_TYPES = [
  { value: "breakfast", label: "Desayuno" },
  { value: "lunch", label: "Almuerzo" },
  { value: "dinner", label: "Cena" },
  { value: "snack", label: "Snack" },
];
function mealTypeLabel(v) {
  for (var i = 0; i < MEAL_TYPES.length; i++) if (MEAL_TYPES[i].value === v) return MEAL_TYPES[i].label;
  return "Snack";
}
/** Sugiere el tipo de comida según la hora (usado como default, el usuario lo puede cambiar). */
function inferMealType(date) {
  var h = date.getHours();
  if (h < 11) return "breakfast";
  if (h < 16) return "lunch";
  if (h < 21) return "dinner";
  return "snack";
}
/** Comidas guardadas antes de esta función no tienen mealType: se infiere por su hora. */
function getMealType(m) {
  return m.mealType || inferMealType(new Date(m.loggedAt));
}
/** Agrupa una lista de comidas por tipo, en el orden fijo Desayuno/Almuerzo/Cena/Snack. */
function groupMealsByType(meals) {
  var groups = {};
  for (var i = 0; i < MEAL_TYPES.length; i++) groups[MEAL_TYPES[i].value] = [];
  for (var j = 0; j < meals.length; j++) groups[getMealType(meals[j])].push(meals[j]);
  return MEAL_TYPES.map(function (t) { return { type: t.value, label: t.label, meals: groups[t.value] }; }).filter(function (g) { return g.meals.length > 0; });
}
function round1(n) { return Math.round(n * 10) / 10; }
function pluralizeEs(word, count) {
  if (count === 1) return word;
  if (/ón$/i.test(word)) return word.slice(0, -2) + "ones";
  return word + "s";
}

function unitLabel(unit, qty) {
  if (unit === "g") return "g";
  if (unit === "ml") return "ml";
  return qty === 1 ? "unidad" : "unidades";
}

/* Rojo -> amarillo -> verde según qué tan cerca de la meta estás (0 a 1) */
function progressColor(pct) {
  pct = Math.max(0, Math.min(1, pct));
  var red = [224, 82, 61], yellow = [224, 160, 48], green = [0, 191, 99];
  var c;
  if (pct < 0.5) {
    var t1 = pct / 0.5;
    c = [red[0] + (yellow[0] - red[0]) * t1, red[1] + (yellow[1] - red[1]) * t1, red[2] + (yellow[2] - red[2]) * t1];
  } else {
    var t2 = (pct - 0.5) / 0.5;
    c = [yellow[0] + (green[0] - yellow[0]) * t2, yellow[1] + (green[1] - yellow[1]) * t2, yellow[2] + (green[2] - yellow[2]) * t2];
  }
  return "#" + c.map(function (x) { return Math.round(x).toString(16).padStart(2, "0"); }).join("");
}

function escapeHtml(str) {

function todayKey(d) {

}

/* ---------------- Render principal (con restauración de foco) ---------------- */
function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  document.documentElement.setAttribute("data-theme", state.theme);
  const app = document.getElementById("app");
  app.innerHTML = buildScreen() + renderConfirmDialog();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

/* ---------------- Gráfico semanal (SVG, sin librerías) ---------------- */
function renderWeeklyChart(goalG) {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0, 0, 0, 0);
    days.push(d);
  }
  const meals = getMeals();
  const totals = days.map(function (d) {
    const key = todayKey(d);
    let sum = 0;
    for (let j = 0; j < meals.length; j++) { if (todayKey(new Date(meals[j].loggedAt)) === key) sum += meals[j].protein; }
    return sum;
  });
  const maxVal = Math.max(goalG, Math.max.apply(null, totals), 1);
  const chartW = 440, chartH = 150, padBottom = 24, padTop = 10;
  const gap = chartW / 7, barW = gap * 0.5;

  const bars = totals.map(function (v, idx) {
    const h = Math.max(2, (v / maxVal) * (chartH - padTop - padBottom));
    const x = idx * gap + (gap - barW) / 2;
    const y = chartH - padBottom - h;
    const pct = goalG > 0 ? Math.min(1, v / goalG) : 0;
    const color = v > 0 ? progressColor(pct) : "var(--border)";
    const label = days[idx].toLocaleDateString("es-ES", { weekday: "short" }).replace(".", "").slice(0, 1).toUpperCase();
    const isToday = todayKey(days[idx]) === todayKey();
    return (
      '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h + '" rx="4" fill="' + color + '"></rect>' +
      '<text x="' + (x + barW / 2) + '" y="' + (chartH - 6) + '" text-anchor="middle" font-size="10.5" fill="var(--muted)" ' +
        'style="font-weight:' + (isToday ? "800" : "600") + ';">' + label + '</text>'
    );
  }).join("");

  const goalY = chartH - padBottom - (goalG > 0 ? (goalG / maxVal) * (chartH - padTop - padBottom) : 0);
  const goalLine = goalG > 0
    ? '<line x1="0" y1="' + goalY + '" x2="' + chartW + '" y2="' + goalY + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4,3"></line>'
    : "";

  return (
    '<div class="card" style="padding:16px 14px 10px;">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; padding:0 4px; margin-bottom:10px;">' +
        '<span class="section-title">Últimos 7 días</span>' +
        (goalG > 0 ? '<span style="font-size:10.5px; color:var(--muted); font-weight:600;">- - - meta diaria</span>' : "") +
      '</div>' +
      '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" style="width:100%; height:auto; display:block;">' + goalLine + bars + '</svg>' +
    '</div>'
  );
}

function renderHistory() {
  const profile = getProfile();
  const goalG = profile ? profile.proteinGoalG : 0;
  const meals = getMeals();

  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 13); cutoff.setHours(0,0,0,0);
  const byDay = {};
  for (let i = 0; i < meals.length; i++) {
    const m = meals[i];
    if (new Date(m.loggedAt) < cutoff) continue;
    const key = todayKey(new Date(m.loggedAt));
    if (!byDay[key]) byDay[key] = { protein: 0, meals: [] };
    byDay[key].protein += m.protein;
    byDay[key].meals.push(m);
  }
  const days = Object.keys(byDay).sort(function(a, b) { return a < b ? 1 : -1; });

  let html = '<div class="dash-header"><h1 style="font-size:23px;">Historial</h1><p>Últimos 14 días</p></div>';
  html += '<div style="padding:14px 20px 30px; display:flex; flex-direction:column; gap:10px;">';
  html += renderWeeklyChart(goalG);
  if (days.length === 0) {
    html += '<div class="empty-state">Todavía no hay historial.<br/>Registra tu primera comida para verla aquí.</div>';
  } else {
    for (let i = 0; i < days.length; i++) {
      const dateKey = days[i];
      const info = byDay[dateKey];
      const pct = goalG > 0 ? Math.min(1, info.protein / goalG) : 0;
      const met = goalG > 0 && info.protein >= goalG;
      const expanded = state.expandedHistoryDay === dateKey;
      html +=
        '<div class="day-card">' +
          '<div class="day-head" data-action="toggle-history-day" data-day="' + dateKey + '" style="cursor:pointer;">' +
            '<div><div class="name">' + fmtDayLabel(dateKey) + '</div>' +
              '<div class="day-bar"><div class="fill" style="width:' + (pct * 100) + '%; background-color:' + progressColor(pct) + ';"></div></div></div>' +
            '<div class="day-right"><div class="g">' + Math.round(info.protein) + ' g</div>' +
              '<div class="pct">' + (met ? "Meta cumplida" : Math.round(pct * 100) + "% de la meta") + '</div></div>' +
          '</div>' +
          (expanded ? '<div class="day-detail">' + renderGroupedMealsCompact(info.meals) + '</div>' : "") +
        '</div>';
    }
  }
  html += '</div>';
  return html;
}

function renderWeightChart(log) {
  if (log.length < 2) {
    return '<p style="font-size:12px; color:var(--muted); text-align:center; padding:10px 4px 2px;">Registrá tu peso un par de veces para ver la tendencia acá.</p>';
  }
  const sorted = log.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  const recent = sorted.slice(-14);
  const values = recent.map(function (e) { return e.weightKg; });
  let minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const chartW = 440, chartH = 100, pad = 14;
  const stepX = recent.length > 1 ? (chartW - 2 * pad) / (recent.length - 1) : 0;
  const points = recent.map(function (e, idx) {
    const x = pad + idx * stepX;
    const y = chartH - pad - ((e.weightKg - minV) / (maxV - minV)) * (chartH - 2 * pad);
    return [x, y];
  });
  const pathD = points.map(function (p, idx) { return (idx === 0 ? "M" : "L") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
  const dots = points.map(function (p) { return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--primary-500)"></circle>'; }).join("");
  function shortDate(dateKey) { return new Date(dateKey + "T00:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "short" }); }

  return (
    '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" style="width:100%; height:auto; display:block;">' +
      '<path d="' + pathD + '" fill="none" stroke="var(--primary-500)" stroke-width="2"></path>' + dots +
    '</svg>' +
    '<div style="display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted); font-weight:600; margin-top:2px;">' +
      '<span>' + shortDate(recent[0].date) + '</span><span>' + shortDate(recent[recent.length - 1].date) + '</span>' +
    '</div>'
  );
}

        '<input id="input-manual-time" class="input" style="margin-bottom:14px;" type="time" value="' + escapeHtml(am.time) + '" data-field="meal-time" />' +
        renderMealTypeSelector(am.mealType) +
        '<div class="ob-option ' + (am.manualFavorite ? "selected" : "") + '" data-action="toggle-manual-favorite" style="margin-bottom:14px;">' +
          '<div>' +
            '<div class="lab">Guardar para elegirla después</div>' +
            '<div class="desc">Va a aparecer en ⭐ Favoritos la próxima vez, sin volver a escribirla</div>' +
          '</div>' +
          '<span style="color:' + (am.manualFavorite ? "var(--warning)" : "var(--muted)") + ';">' + (am.manualFavorite ? ICONS.starFilled : ICONS.starOutline) + '</span>' +
        '</div>' +
        '<button class="btn btn-primary" data-action="save-manual-meal" ' + (validManual ? "" : "disabled") + '>' + (am.editingMealId ? "Guardar cambios" : "Guardar comida") + '</button>' +
        (am.editingMealId ? '<button class="btn btn-ghost" style="color:var(--danger); margin-top:8px;" data-action="delete-editing-meal">Eliminar esta comida</button>' : "") +
      '</div>';
  }

  const showQuickAccess = query.length === 0 && am.mode === "search" && !am.editingMealId;

  let html =
    '<div class="screen">' +
      '<div class="am-header"><button class="am-close" data-action="close-add-meal">' + ICONS.back + '</button><h1>' + (am.editingMealId ? "Editar comida" : "Agregar comida") + '</h1></div>' +
      '<div class="scroll">' +
        '<div style="padding:0 20px 14px;">' +
          '<div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:12px 14px;">' +
            '<span style="color:var(--muted); display:flex;">' + ICONS.search + '</span>' +
            '<input id="input-search" style="flex:1; border:none; outline:none; background:transparent; font-size:15px; color:var(--fg);" placeholder="Buscar alimento…" value="' + escapeHtml(am.query) + '" data-field="add-meal-query" autofocus />' +
          '</div>' +
        '</div>';

  if (am.mode === "search" && !am.editingMealId) {
    html +=
      '<div class="chip-row">' +
        CATEGORY_CHIPS.map(function (c) {
          const isActive = query.toLowerCase() === c.query.toLowerCase();
          return '<button class="chip ' + (isActive ? "chip-active" : "") + '" data-action="filter-category" data-value="' + escapeHtml(c.query) + '">' + c.label + '</button>';
        }).join("") +
      '</div>';
  }

  if (showQuickAccess) html += renderQuickAccess(favorites, recent);

  if (query.length >= 1) {
    html += '<div style="padding:0 20px;"><div class="section-title" style="margin-bottom:10px;">Resultados</div><div style="display:flex; flex-direction:column; gap:8px;">';
    for (let i = 0; i < results.length; i++) {
      const f = results[i];
      const sel = am.selectedFoodId === f.id;
      html +=
        '<div class="food-row ' + (sel ? "selected" : "") + '" data-action="select-food" data-id="' + f.id + '">' +
          '<div><p class="food-name">' + escapeHtml(f.name) + '</p>' +
            '<p class="food-sub">' + f.protein100 + ' g proteína' + (f.kcal100 != null ? " · " + Math.round(f.kcal100) + " kcal" : "") + ' / 100 ' + (f.unit === "unit" ? "g" : f.unit) + '</p></div>' +
          '<span style="font-size:13px; font-weight:700; color:' + (sel ? "var(--primary-600)" : "var(--muted)") + ';">' + (sel ? "Seleccionado" : "›") + '</span>' +
        '</div>';
    }
    html +=
      '<div class="food-row" data-action="switch-manual-mode">' +
        '<div><p class="food-name">No lo encuentro</p><p class="food-sub">Ingresar los datos manualmente</p></div>' +
        '<span style="color:var(--muted); display:flex;">' + ICONS.pencil + '</span>' +
      '</div>';
    html += '</div></div>';
  }

  html += manualBlock + quantityBlock;
  html += '<div class="footer-note">Meta: registrar una comida en menos de 10 segundos.</div>';
  html += '</div></div>';
  return html;
}

function renderQuickAccess(favorites, recent) {
  if (favorites.length === 0 && recent.length === 0) {
    return '<div class="empty-state" style="padding:30px;">Busca un alimento o registra tu primera comida para verla acá la próxima vez.</div>';
  }
  function list(title, items) {
    if (items.length === 0) return "";
    return (
      '<div style="margin-bottom:18px;">' +
        '<div class="section-title" style="padding:0 20px; margin-bottom:10px;">' + title + '</div>' +
        '<div style="display:flex; flex-direction:column; gap:8px; padding:0 20px;">' +
          items.map(function(m) {
            return (
              '<div class="food-row" data-action="quick-log" data-id="' + m.id + '" style="cursor:pointer;">' +
                '<div class="meal-left" style="gap:11px;">' +
                  '<div class="meal-icon">' + ICONS.meal + '</div>' +
                  '<div><p class="food-name">' + escapeHtml(m.foodName) + '</p>' +
                    '<p class="food-sub">' + m.qty + ' ' + unitLabel(m.unit, m.qty) + (m.kcal != null ? " · " + Math.round(m.kcal) + " kcal" : "") + '</p></div>' +
                '</div>' +
                '<span style="font-size:13px; font-weight:800; color:var(--primary-600); flex-shrink:0;">+' + Math.round(m.protein) + ' g</span>' +
              '</div>'
            );
          }).join("") +
        '</div>' +
      '</div>'
    );
  }
  return (
    '<p style="padding:0 20px; font-size:11.5px; color:var(--muted); margin:-2px 0 14px;">Tocá una para registrarla al instante, sin volver a escribir ni buscar.</p>' +
    list('<span style="display:inline-flex; align-items:center; gap:5px;">' + ICONS.starFilled + ' Favoritos</span>', favorites) +
    list('<span style="display:inline-flex; align-items:center; gap:5px;">' + ICONS.clock + ' Anteriores</span>', recent)
  );
}

/* ---------------- Acciones (event delegation) ---------------- */
document.getElementById("app").addEventListener("click", function(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const value = el.dataset.value;

  if (action === "nav") { setScreen(el.dataset.screen); return; }

  if (action === "ob-set-sex") { state.ob.sex = value; render(); return; }
  if (action === "ob-set-goal") { state.ob.goal = value; render(); return; }
  if (action === "ob-set-activity") { state.ob.activity = value; render(); return; }
  if (action === "ob-next") { state.ob.step = Math.min(3, state.ob.step + 1); render(); return; }
  if (action === "ob-prev") { state.ob.step = Math.max(0, state.ob.step - 1); render(); return; }
  if (action === "ob-finish") { finishOnboarding(); return; }

  if (action === "open-add-meal") {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0"), mm = String(now.getMinutes()).padStart(2, "0");
    state.addMeal = { mode: "search", query: "", selectedFoodId: null, qty: null, qtyMode: "g", time: hh + ":" + mm, mealType: inferMealType(now), editingMealId: null, manualName: "", manualProtein: "", manualCalories: "", manualFavorite: true };
    setScreen("add-meal");
    return;
  }
  if (action === "close-add-meal") { setScreen("dashboard"); return; }
  if (action === "select-food") {
    const f = findFood(id);
    state.addMeal.selectedFoodId = id;
    state.addMeal.qtyMode = "g";
    state.addMeal.qty = f.unit === "unit" ? 1 : 100;
    render();
    return;
  }
  if (action === "set-qty-mode") {
    state.addMeal.qtyMode = value;
    state.addMeal.qty = value === "portion" ? 1 : 100;
    render();
    return;
  }
  if (action === "qty-delta") {
    const delta = parseFloat(el.dataset.delta);
    const next = Math.max(0, round1((state.addMeal.qty || 0) + delta));
    state.addMeal.qty = next;
    render();
    return;
  }
  if (action === "save-quantity-meal") { saveQuantityMeal(); return; }
  if (action === "switch-manual-mode") { state.addMeal.mode = "manual"; render(); return; }
  if (action === "filter-category") {
    state.addMeal.query = value || "";
    state.addMeal.selectedFoodId = null;
    render();
    return;
  }
  if (action === "toggle-manual-favorite") { state.addMeal.manualFavorite = !state.addMeal.manualFavorite; render(); return; }
  if (action === "set-meal-type") { state.addMeal.mealType = value; render(); return; }
  if (action === "save-manual-meal") { saveManualMeal(); return; }
  if (action === "quick-log") { quickLogMeal(id); return; }

  if (action === "toggle-favorite") { toggleFavorite(id); return; }
  if (action === "duplicate-meal") { duplicateMeal(id); return; }
  if (action === "edit-meal") { openEditMeal(id); return; }
  if (action === "delete-editing-meal") {
    if (state.addMeal.editingMealId) { deleteMealById(state.addMeal.editingMealId); setScreen("dashboard"); }
    return;
  }
  if (action === "delete-meal") { deleteMealById(id); return; }
  if (action === "toggle-meal-order") {
  state.mealOrder = state.mealOrder === "newest" ? "oldest" : "newest";
  render();
  return;
}

  if (action === "toggle-history-day") {
    state.expandedHistoryDay = state.expandedHistoryDay === el.dataset.day ? null : el.dataset.day;
    render();
    return;
  }

  if (action === "settings-set-sex") { state.settingsDraft.sex = value; render(); return; }
  if (action === "settings-set-activity") { state.settingsDraft.activity = value; render(); return; }
  if (action === "settings-set-goal") { state.settingsDraft.goal = value; render(); return; }
  if (action === "settings-save") { saveSettings(); return; }
  if (action === "log-weight-today") {
    const input = document.getElementById("input-quick-weight");
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 30 || val > 300) { input.focus(); return; }
    logWeight(val, todayKey());
    state.settingsDraft.weight = String(val);
    saveSettings();
    return;
  }
  if (action === "toggle-theme") {
    state.theme = state.theme === "dark" ? "light" : "dark";
    lsSet(LS_KEYS.theme, state.theme);
    render();
    return;
  }
  if (action === "reset-data") {
    state.confirmDialog = {
      title: "Borrar todos los datos",
      message: "Se va a borrar tu perfil, todas las comidas y el historial de peso guardados en este dispositivo. Esta acción no se puede deshacer.",
      confirmLabel: "Sí, borrar todo",
      onConfirm: "do-reset-data",
    };
    render();
    return;
  }
  if (action === "dialog-cancel") { state.confirmDialog = null; render(); return; }
  if (action === "dialog-confirm") {
    const pending = state.confirmDialog;
    state.confirmDialog = null;
    if (pending && pending.onConfirm === "do-reset-data") performResetData();
    else render();
    return;
  }
});

document.getElementById("app").addEventListener("input", function(e) {
  const field = e.target.dataset.field;
  if (!field) return;
  const v = e.target.value;

  if (field === "ob-name") { state.ob.name = v; render(); return; }
  if (field === "ob-age") { state.ob.age = v; return; }
  if (field === "ob-height") { state.ob.height = v; return; }
  if (field === "ob-weight") { state.ob.weight = v; render(); return; }
  if (field === "add-meal-query") { state.addMeal.query = v; state.addMeal.selectedFoodId = null; render(); return; }
  if (field === "qty-value") {
    const n = parseFloat(v.replace(",", "."));
    if (isNaN(n)) return; // el usuario está tipeando (ej. "1." o vacío): no pisamos lo que escribió
    state.addMeal.qty = n;
    render();
    return;
  }
  if (field === "manual-name") { state.addMeal.manualName = v; render(); return; }
  if (field === "manual-protein") { state.addMeal.manualProtein = v; render(); return; }
  if (field === "meal-time") { state.addMeal.time = v; return; }
  if (field === "manual-calories") { state.addMeal.manualCalories = v; return; }
  if (field === "settings-name") { state.settingsDraft.name = v; return; }
  if (field === "settings-age") { state.settingsDraft.age = v; return; }
  if (field === "settings-height") { state.settingsDraft.height = v; render(); return; }
  if (field === "settings-weight") { state.settingsDraft.weight = v; render(); return; }
});

/* ---------------- Handlers de negocio ---------------- */
function finishOnboarding() {
  const ob = state.ob;
  const heightN = parseFloat(ob.height), weightN = parseFloat(ob.weight), ageN = parseInt(ob.age, 10);
  const bmi = calcBMI(weightN, heightN);
  const g = dailyProteinGoal({ weightKg: weightN, activityLevel: ob.activity, goal: ob.goal });

  saveProfile({
    name: ob.name.trim(), age: ageN, sex: ob.sex, heightCm: heightN, weightKg: weightN, activityLevel: ob.activity, goal: ob.goal,
    bmi: bmi, proteinGoalG: g.proteinGoalG, proteinPerKg: g.proteinPerKg,
  });
  logWeight(weightN, todayKey());
  setScreen("dashboard");
}

function saveQuantityMeal() {
  const am = state.addMeal;
  const food = findFood(am.selectedFoodId);
  if (!food) return;
  const usingPortion = food.unit !== "unit" && food.portionG && am.qtyMode === "portion";
  const storedQty = usingPortion ? round1(am.qty * food.portionG) : am.qty;
  const macros = macrosFor(food, storedQty, food.unit);
  const meals = getMeals();
  const data = {
    foodId: food.id, foodName: food.name, qty: storedQty, unit: food.unit,
    protein: macros.protein, kcal: macros.kcal, mealType: am.mealType, loggedAt: buildLoggedAt(am.time),
  };
  if (am.editingMealId) {
    const idx = meals.findIndex(function (m) { return m.id === am.editingMealId; });
    if (idx !== -1) meals[idx] = Object.assign({}, meals[idx], data);
  } else {
    meals.unshift(Object.assign({ id: uid("meal"), favorite: false }, data));
  }
  saveMeals(meals);
  setScreen("dashboard");
}

function saveManualMeal() {
  const am = state.addMeal;
  const proteinN = parseFloat(am.manualProtein);
  if (!am.manualName.trim() || isNaN(proteinN) || proteinN < 0) return;
  const kcalN = am.manualCalories.trim() ? parseFloat(am.manualCalories) : null;
  const meals = getMeals();
  const data = {
    foodId: null, foodName: am.manualName.trim(), qty: 1, unit: "unit",
    protein: proteinN, kcal: (kcalN != null && !isNaN(kcalN)) ? kcalN : null,
    favorite: am.manualFavorite, mealType: am.mealType, loggedAt: buildLoggedAt(am.time),
  };
  if (am.editingMealId) {
    const idx = meals.findIndex(function (m) { return m.id === am.editingMealId; });
    if (idx !== -1) meals[idx] = Object.assign({}, meals[idx], data);
  } else {
    meals.unshift(Object.assign({ id: uid("meal") }, data));
  }
  saveMeals(meals);
  setScreen("dashboard");
}

function openEditMeal(id) {
  const meals = getMeals();
  const m = meals.find(function (x) { return x.id === id; });
  if (!m) return;
  const d = new Date(m.loggedAt);
  const timeStr = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const food = m.foodId ? findFood(m.foodId) : null;

  if (food) {
    state.addMeal = {
      mode: "search", query: "", selectedFoodId: food.id, qty: m.qty, qtyMode: "g", time: timeStr,
      mealType: getMealType(m), editingMealId: m.id,
      manualName: "", manualProtein: "", manualCalories: "", manualFavorite: m.favorite,
    };
  } else {
    state.addMeal = {
      mode: "manual", query: "", selectedFoodId: null, qty: null, qtyMode: "g", time: timeStr,
      mealType: getMealType(m), editingMealId: m.id,
      manualName: m.foodName, manualProtein: String(m.protein), manualCalories: m.kcal != null ? String(m.kcal) : "",
      manualFavorite: m.favorite,
    };
  }
  setScreen("add-meal");
}

function quickLogMeal(id) {
  const meals = getMeals();
  let source = null;
  for (let i = 0; i < meals.length; i++) { if (meals[i].id === id) { source = meals[i]; break; } }
  if (!source) return;
  const copy = Object.assign({}, source, { id: uid("meal"), loggedAt: new Date().toISOString() });
  meals.unshift(copy);
  saveMeals(meals);
  setScreen("dashboard");
}

function toggleFavorite(id) {
  const meals = getMeals().map(function(m) { return m.id === id ? Object.assign({}, m, { favorite: !m.favorite }) : m; });
  saveMeals(meals);
  render();
}
function duplicateMeal(id) { quickLogMeal(id); }
function deleteMealById(id) {
  const meals = getMeals().filter(function(m) { return m.id !== id; });
  saveMeals(meals);
  render();
}
function performResetData() {
  localStorage.removeItem(LS_KEYS.profile);
  localStorage.removeItem(LS_KEYS.meals);
  localStorage.removeItem(LS_KEYS.customFoods);
  localStorage.removeItem(LS_KEYS.weightLog);
  state.settingsDraft = null;
  state.ob = { step: 0, name: "", age: "", sex: null, height: "", weight: "", goal: null, activity: null };
  setScreen("onboarding");
}

function saveSettings() {
  const d = state.settingsDraft;
  const heightN = parseFloat(d.height), weightN = parseFloat(d.weight), ageN = parseInt(d.age, 10);
  const bmi = calcBMI(weightN, heightN);
  const g = dailyProteinGoal({ weightKg: weightN, activityLevel: d.activity, goal: d.goal });
  saveProfile({
    name: d.name.trim(), age: ageN, sex: d.sex, heightCm: heightN, weightKg: weightN, activityLevel: d.activity, goal: d.goal,
    bmi: bmi, proteinGoalG: g.proteinGoalG, proteinPerKg: g.proteinPerKg,
  });
  if (!isNaN(weightN)) logWeight(weightN, todayKey());
  render();
}

/* ---------------- PWA: service worker mínimo (offline) ---------------- */
/* Solo funciona en https:// o localhost (los navegadores exigen contexto
   seguro para Service Workers) — en file:// simplemente no hace nada,
   sin romper el resto de la app. */
(function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  try {
    var swCode =
      "self.addEventListener('install', function(e){" +
      "  e.waitUntil(caches.open('protein-tracker-v1').then(function(c){ return c.add(self.registration.scope); }).then(function(){ return self.skipWaiting(); }));" +
      "});" +
      "self.addEventListener('activate', function(e){ e.waitUntil(self.clients.claim()); });" +
      "self.addEventListener('fetch', function(e){" +
      "  if (e.request.method !== 'GET') return;" +
      "  e.respondWith(" +
      "    caches.match(e.request).then(function(cached){" +
      "      return cached || fetch(e.request).then(function(res){" +
      "        var copy = res.clone();" +
      "        caches.open('protein-tracker-v1').then(function(c){ c.put(e.request, copy); });" +
      "        return res;" +
      "      }).catch(function(){ return caches.match(self.registration.scope); });" +
      "    })" +
      "  );" +
      "});";
    var blob = new Blob([swCode], { type: "application/javascript" });
    var swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(function () {});
  } catch (e) {
    /* silencioso: si falla, la app sigue funcionando igual, solo sin offline */
  }
})();

/* ---------------- Init ---------------- */
(function init() {
  const profile = getProfile();
  state.screen = profile ? "dashboard" : "onboarding";
  render();
})();
</script>
